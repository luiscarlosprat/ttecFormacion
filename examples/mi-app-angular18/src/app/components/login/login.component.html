<div class="login-container">
  <div class="login-card">
    <div class="tabs">
      <button
        [class.activo]="modo === 'login'"
        (click)="cambiarModo('login')"
      >
        Iniciar sesión
      </button>

      <button
        [class.activo]="modo === 'registro'"
        (click)="cambiarModo('registro')"
      >
        Crear cuenta
      </button>
    </div>

    <div *ngIf="modo === 'login'">
      <h1>Iniciar sesión</h1>

      <p>Introduce tu email y contraseña</p>

      <input
        type="text"
        [(ngModel)]="loginUsername"
        placeholder="Usuario"
      />

      <input
        type="password"
        [(ngModel)]="loginPassword"
        placeholder="Contraseña"
      />

      <button class="btn-principal" (click)="iniciarSesion()">
        Entrar
      </button>

      <p class="error" *ngIf="errorLogin">{{ errorLogin }}</p>
    </div>

    <div *ngIf="modo === 'registro'">
      <h1>Crear cuenta</h1>

      <input
        type="text"
        [(ngModel)]="registerUsername"
        placeholder="Username"
      />

      <input
        type="email"
        [(ngModel)]="registerEmail"
        placeholder="Email"
      />

      <input
        type="password"
        [(ngModel)]="registerPassword"
        placeholder="Contraseña"
      />

      <input
        type="password"
        [(ngModel)]="registerPasswordConfirm"
        placeholder="Repite la contraseña"
      />

      <button class="btn-principal" (click)="crearCuenta()">
        Crear cuenta
      </button>

      <p class="error" *ngIf="errorRegistro">{{ errorRegistro }}</p>
      <p class="ok" *ngIf="mensajeRegistro">{{ mensajeRegistro }}</p>
    </div>
  </div>
</div>
